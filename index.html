<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ศูนย์สำรองเครื่องมือแพทย์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAF6EC;
      --surface: #FFFFFF;
      --surface-2: #F1E9D8;
      --head-1: #1D3E4E;
      --head-2: #2C5F79;
      --accent: #D97B29;
      --ink: #26302E;
      --ink-2: #4A5558;
      --ink-muted: #6B7A80;
      --border: #E3DCC9;
      /* สีสถานะ (ผ่านการตรวจ colorblind-safe แล้ว) */
      --st-ready: #0CA30C;
      --st-loan: #2B7FC0;
      --st-none: #D03B3B;
      --ready-ink: #0A7A0A;
      --warn-bg: #FBEBD9; --warn-ink: #7a3b0c; --warn-border: #E8B98C;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161a1b; --surface: #1f2426; --surface-2: #283033;
        --head-1: #12262f; --head-2: #1d4254;
        --ink: #E9EDEE; --ink-2: #C3CBCD; --ink-muted: #8E9A9E; --border: #333C3F;
        --st-ready: #1FB31F; --st-loan: #4A9BDB; --st-none: #E05555; --ready-ink: #4CCB4C;
        --warn-bg: #3a2a1a; --warn-ink: #F3C79A; --warn-border: #6b4a2a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161a1b; --surface: #1f2426; --surface-2: #283033;
      --head-1: #12262f; --head-2: #1d4254;
      --ink: #E9EDEE; --ink-2: #C3CBCD; --ink-muted: #8E9A9E; --border: #333C3F;
      --st-ready: #1FB31F; --st-loan: #4A9BDB; --st-none: #E05555; --ready-ink: #4CCB4C;
      --warn-bg: #3a2a1a; --warn-ink: #F3C79A; --warn-border: #6b4a2a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Sarabun', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 0 0 20px;
      font-size: 15px;
    }
    .app-header {
      background: linear-gradient(135deg, var(--head-1), var(--head-2));
      border-bottom: 3px solid var(--accent);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .app-header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
    .app-header .sub { font-size: .85rem; opacity: .85; }
    .app-header .spacer { flex: 1; }
    .btn {
      font: inherit; font-size: .85rem;
      border: 1px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.12);
      color: #fff; border-radius: 8px;
      padding: 6px 12px; cursor: pointer;
    }
    .btn:hover { background: rgba(255,255,255,.22); }
    .btn:disabled { opacity: .6; cursor: wait; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .error {
      background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; display: none;
    }
    .error code { background: rgba(0,0,0,.08); padding: 1px 4px; border-radius: 4px; }

    .overview {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 16px;
      display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline;
    }
    .overview .big { font-size: 2.2rem; font-weight: 700; color: var(--ready-ink); line-height: 1; font-variant-numeric: tabular-nums; }
    .overview .lbl { font-size: .9rem; color: var(--ink-2); }
    .overview .item { display: flex; align-items: baseline; gap: 8px; }
    .overview .num { font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-2); margin: 0 0 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .dev {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
      border-left: 5px solid var(--st-ready);
    }
    .dev.none { border-left-color: var(--st-none); }
    .dev h3 { margin: 0; font-size: 1.02rem; }
    .avail { display: flex; align-items: baseline; gap: 8px; }
    .avail .n { font-size: 2.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ready-ink); }
    .dev.none .avail .n { color: var(--st-none); }
    .avail .t { font-size: .9rem; color: var(--ink-2); }
    .badge {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600;
      border: 1px solid currentColor; color: var(--ready-ink);
    }
    .dev.none .badge { color: var(--st-none); }
    .bar { display: flex; height: 10px; gap: 2px; }
    .bar div { height: 100%; min-width: 3px; }
    .bar div:first-child { border-radius: 4px 0 0 4px; }
    .bar div:last-child { border-radius: 0 4px 4px 0; }
    .bar div:only-child { border-radius: 4px; }
    .meta { font-size: .82rem; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

    .tooltip {
      position: fixed; pointer-events: none; z-index: 10;
      background: var(--ink); color: var(--bg); font-size: .8rem;
      padding: 6px 9px; border-radius: 6px; display: none;
    }
    footer { text-align: center; font-size: .78rem; color: var(--ink-muted); margin-top: 14px; }
    .empty { color: var(--ink-muted); text-align: center; padding: 24px 0; }

    @media (max-width: 480px) {
      main { padding: 12px 16px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .dev { padding: 12px; }
      .avail .n { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>ศูนย์สำรองเครื่องมือแพทย์ – เครื่องที่ยืมได้</h1>
      <div class="sub" id="updated">กำลังโหลดข้อมูล…</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="refreshBtn" type="button">↻ รีเฟรช</button>
  </header>

  <main>
    <div class="error" id="error"></div>
    <section class="overview" id="overview"></section>
    <div class="legend">
      <span><span class="dot" style="background:var(--st-ready)"></span>พร้อมให้ยืม</span>
      <span><span class="dot" style="background:var(--st-loan)"></span>ถูกยืมอยู่</span>
    </div>
    <section class="grid" id="grid"></section>
    <footer>ข้อมูลจาก Google Sheet (แท็บ Summary) อัปเดตอัตโนมัติทุก 5 นาที</footer>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    /* ================== ตั้งค่า ================== */
    const SHEET_ID = '1-qVQwnTXYy0pRpAxG85BRLzB4HfoBQBfGfmTV04M4hs';
    const SHEET_NAME = 'Summary';
    const REFRESH_MS = 5 * 60 * 1000;
    /* ============================================ */

    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ดึงข้อมูลผ่าน Google Visualization API (JSONP)
    let cbSeq = 0;
    function fetchSheet(sheetName) {
      return new Promise((resolve, reject) => {
        const cb = '__gviz_cb_' + (++cbSeq);
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลาโหลดข้อมูล')); }, 20000);
        function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
        window[cb] = (resp) => {
          cleanup();
          if (resp.status === 'error') reject(new Error((resp.errors || []).map((e) => e.detailed_message || e.message).join(', ')));
          else resolve(resp.table);
        };
        script.onerror = () => { cleanup(); reject(new Error('โหลดข้อมูลไม่สำเร็จ')); };
        script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq'
          + '?sheet=' + encodeURIComponent(sheetName)
          + '&headers=1&tqx=responseHandler:' + cb + '&_=' + Date.now();
        document.head.appendChild(script);
      });
    }

    const text = (c) => (c && c.v !== null && c.v !== undefined ? String(c.f ?? c.v).trim() : '');
    const num = (c) => { const n = parseFloat(c && c.v !== null && c.v !== undefined ? c.v : ''); return isNaN(n) ? 0 : n; };

    // แปลงแท็บ Summary: แถวหัว = ชื่อเครื่อง, แถว "พร้อมใช้" และ "ยืมภายใน"
    function parseSummary(table) {
      const labels = table.cols.map((c) => (c.label || '').trim());
      let readyRow = null, loanRow = null;
      for (const r of table.rows || []) {
        if (!r || !r.c) continue;
        const k = text(r.c[0]).replace(/\s+/g, '');
        if (!readyRow && k.startsWith('พร้อม')) readyRow = r;
        else if (!loanRow && k.includes('ยืม')) loanRow = r;
      }
      if (!readyRow) throw new Error('ไม่พบแถว "พร้อมใช้" ในแท็บ ' + SHEET_NAME);
      const devices = [];
      for (let i = 1; i < labels.length; i++) {
        const name = labels[i];
        if (!name || name.replace(/\s+/g, '') === 'รวม') continue;
        const ready = num(readyRow.c[i]);
        const loan = loanRow ? num(loanRow.c[i]) : 0;
        devices.push({ name, ready, loan, total: ready + loan });
      }
      return devices;
    }

    function render(devices) {
      const ready = devices.reduce((s, d) => s + d.ready, 0);
      const loan = devices.reduce((s, d) => s + d.loan, 0);
      const typesAvail = devices.filter((d) => d.ready > 0).length;
      $('overview').innerHTML =
        '<div class="item"><span class="big">' + ready + '</span><span class="lbl">เครื่องพร้อมให้ยืมตอนนี้</span></div>'
        + '<div class="item"><span class="num">' + typesAvail + '/' + devices.length + '</span><span class="lbl">ประเภทที่มีเครื่องว่าง</span></div>'
        + '<div class="item"><span class="num">' + loan + '</span><span class="lbl">เครื่องถูกยืมอยู่</span></div>';

      $('grid').innerHTML = devices.map((d) => {
        const none = d.ready <= 0;
        const segs = [
          d.ready > 0 ? '<div data-tip="' + esc(d.name + ' · พร้อมให้ยืม ' + d.ready + ' เครื่อง') + '" style="flex:' + d.ready + ';background:var(--st-ready)"></div>' : '',
          d.loan > 0 ? '<div data-tip="' + esc(d.name + ' · ถูกยืมอยู่ ' + d.loan + ' เครื่อง') + '" style="flex:' + d.loan + ';background:var(--st-loan)"></div>' : '',
        ].join('');
        return '<article class="dev' + (none ? ' none' : '') + '">'
          + '<h3>' + esc(d.name) + '</h3>'
          + '<div class="avail"><span class="n">' + d.ready + '</span><span class="t">เครื่องว่าง</span></div>'
          + '<span class="badge">' + (none ? '✕ ไม่มีเครื่องว่าง' : '✓ ยืมได้') + '</span>'
          + (d.total > 0 ? '<div class="bar">' + segs + '</div>' : '')
          + '<div class="meta">ถูกยืม ' + d.loan + ' · ทั้งหมด ' + d.total + ' เครื่อง</div>'
          + '</article>';
      }).join('') || '<div class="empty">ไม่มีข้อมูล</div>';
    }

    async function load() {
      const btn = $('refreshBtn');
      const errBox = $('error');
      btn.disabled = true;
      try {
        render(parseSummary(await fetchSheet(SHEET_NAME)));
        errBox.style.display = 'none';
        $('updated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
      } catch (e) {
        errBox.style.display = 'block';
        errBox.innerHTML = '<strong>โหลดข้อมูลไม่สำเร็จ:</strong> ' + esc(e.message)
          + '<br>ตรวจสอบว่า Google Sheet แชร์เป็น <code>ทุกคนที่มีลิงก์ – ผู้มีสิทธิ์อ่าน</code> และมีแท็บชื่อ <code>' + esc(SHEET_NAME) + '</code>';
        if (!$('grid').innerHTML) $('updated').textContent = 'ยังโหลดข้อมูลไม่ได้';
      } finally {
        btn.disabled = false;
      }
    }

    $('refreshBtn').addEventListener('click', load);
    const tip = $('tooltip');
    document.addEventListener('mousemove', (e) => {
      const t = e.target.closest('[data-tip]');
      if (!t) { tip.style.display = 'none'; return; }
      tip.textContent = t.dataset.tip;
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
    });

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
