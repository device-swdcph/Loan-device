<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เครื่องมือแพทย์ที่ยืมได้</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF;
      --ink: #1F2426;
      --ink-2: #5F6B70;
      --ink-3: #9AA4A8;
      --line: #ECEEEF;
      --track: #F1F3F4;
      /* สีสถานะ (ผ่านการตรวจ colorblind-safe แล้ว) */
      --st-ready: #0CA30C;
      --st-loan: #2B7FC0;
      --st-none: #D03B3B;
      --ready-ink: #0A7A0A;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161819; --ink: #ECEFF0; --ink-2: #A9B3B7; --ink-3: #6F797D;
        --line: #2A2E30; --track: #25292B;
        --st-ready: #1FB31F; --st-loan: #4A9BDB; --st-none: #E05555; --ready-ink: #4CCB4C;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161819; --ink: #ECEFF0; --ink-2: #A9B3B7; --ink-3: #6F797D;
      --line: #2A2E30; --track: #25292B;
      --st-ready: #1FB31F; --st-loan: #4A9BDB; --st-none: #E05555; --ready-ink: #4CCB4C;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Prompt', sans-serif;
      font-weight: 300;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      font-size: 15px;
    }
    main { max-width: 960px; margin: 0 auto; padding: 28px 16px 24px; }

    header { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    header .titles { flex: 1; min-width: 0; }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 500; letter-spacing: .1px; }
    .sub { font-size: .82rem; color: var(--ink-3); margin-top: 2px; }
    .refresh {
      font: inherit; font-size: .82rem; color: var(--ink-2);
      background: none; border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 14px; cursor: pointer;
    }
    .refresh:hover { border-color: var(--ink-3); color: var(--ink); }
    .refresh:disabled { opacity: .5; cursor: wait; }

    .error {
      border: 1px solid var(--st-none); color: var(--st-none);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; font-size: .88rem; display: none;
    }

    .overview { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 28px; }
    .stat .n { font-size: 2.4rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
    .stat .n.ok { color: var(--ready-ink); }
    .stat .l { font-size: .82rem; color: var(--ink-2); margin-top: 6px; }

    .list { border-top: 1px solid var(--line); }
    .row {
      display: grid; grid-template-columns: minmax(0, 1.4fr) 110px minmax(0, 1fr);
      gap: 20px; align-items: center;
      padding: 14px 2px; border-bottom: 1px solid var(--line);
    }
    .name { font-size: 1rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .state { font-size: .8rem; margin-top: 2px; display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
    .state .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st-ready); }
    .row.none .state .dot { background: var(--st-none); }
    .row.none .state { color: var(--st-none); }
    .avail { text-align: right; }
    .avail .n { font-size: 1.7rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ready-ink); }
    .row.none .avail .n { color: var(--ink-3); }
    .avail .u { font-size: .75rem; color: var(--ink-3); }
    .bar { display: flex; height: 6px; gap: 2px; background: var(--track); border-radius: 3px; }
    .bar div { height: 100%; min-width: 3px; }
    .bar div:first-child { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }
    .bar div:last-child { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
    .meta { font-size: .75rem; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }

    .legend { display: flex; gap: 16px; font-size: .75rem; color: var(--ink-3); margin: 18px 0 0; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 6px; border-radius: 2px; display: inline-block; }

    .tooltip {
      position: fixed; pointer-events: none; z-index: 10;
      background: var(--ink); color: var(--bg); font-size: .78rem;
      padding: 5px 9px; border-radius: 6px; display: none;
    }
    .empty { color: var(--ink-3); text-align: center; padding: 24px 0; }

    @media (max-width: 560px) {
      main { padding-top: 20px; }
      .overview { gap: 24px; }
      .stat .n { font-size: 2rem; }
      .row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
      .row .usage { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="titles">
        <h1>เครื่องมือแพทย์ที่ยืมได้</h1>
        <div class="sub"><span>ศูนย์สำรองเครื่องมือแพทย์</span> · <span id="updated">กำลังโหลด…</span></div>
      </div>
      <button class="refresh" id="refreshBtn" type="button">รีเฟรช</button>
    </header>

    <div class="error" id="error"></div>
    <section class="overview" id="overview"></section>
    <section class="list" id="grid"></section>
    <div class="legend">
      <span><i style="background:var(--st-ready)"></i>ว่าง</span>
      <span><i style="background:var(--st-loan)"></i>ถูกยืม</span>
    </div>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    /* ================== ตั้งค่า ================== */
    const SHEET_ID = '1-qVQwnTXYy0pRpAxG85BRLzB4HfoBQBfGfmTV04M4hs';
    const SHEET_NAME = 'Summary';
    const REFRESH_MS = 5 * 60 * 1000;
    /* ============================================ */

    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ดึงข้อมูลผ่าน Google Visualization API (JSONP)
    let cbSeq = 0;
    function fetchSheet(sheetName) {
      return new Promise((resolve, reject) => {
        const cb = '__gviz_cb_' + (++cbSeq);
        const script = document.createElement('script');
        const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลาโหลดข้อมูล')); }, 20000);
        function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }
        window[cb] = (resp) => {
          cleanup();
          if (resp.status === 'error') reject(new Error((resp.errors || []).map((e) => e.detailed_message || e.message).join(', ')));
          else resolve(resp.table);
        };
        script.onerror = () => { cleanup(); reject(new Error('โหลดข้อมูลไม่สำเร็จ')); };
        script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq'
          + '?sheet=' + encodeURIComponent(sheetName)
          + '&headers=1&tqx=responseHandler:' + cb + '&_=' + Date.now();
        document.head.appendChild(script);
      });
    }

    const text = (c) => (c && c.v !== null && c.v !== undefined ? String(c.f ?? c.v).trim() : '');
    const num = (c) => { const n = parseFloat(c && c.v !== null && c.v !== undefined ? c.v : ''); return isNaN(n) ? 0 : n; };

    // แปลงแท็บ Summary: แถวหัว = ชื่อเครื่อง, แถว "พร้อมใช้" และ "ยืมภายใน"
    function parseSummary(table) {
      const labels = table.cols.map((c) => (c.label || '').trim());
      let readyRow = null, loanRow = null;
      for (const r of table.rows || []) {
        if (!r || !r.c) continue;
        const k = text(r.c[0]).replace(/\s+/g, '');
        if (!readyRow && k.startsWith('พร้อม')) readyRow = r;
        else if (!loanRow && k.includes('ยืม')) loanRow = r;
      }
      if (!readyRow) throw new Error('ไม่พบแถว "พร้อมใช้" ในแท็บ ' + SHEET_NAME);
      const devices = [];
      for (let i = 1; i < labels.length; i++) {
        const name = labels[i];
        if (!name || name.replace(/\s+/g, '') === 'รวม') continue;
        const ready = num(readyRow.c[i]);
        const loan = loanRow ? num(loanRow.c[i]) : 0;
        devices.push({ name, ready, loan, total: ready + loan });
      }
      return devices;
    }

    function render(devices) {
      const ready = devices.reduce((s, d) => s + d.ready, 0);
      const loan = devices.reduce((s, d) => s + d.loan, 0);
      const typesAvail = devices.filter((d) => d.ready > 0).length;
      $('overview').innerHTML =
        '<div class="stat"><div class="n ok">' + ready + '</div><div class="l">เครื่องว่างให้ยืม</div></div>'
        + '<div class="stat"><div class="n">' + typesAvail + '<span style="color:var(--ink-3)">/' + devices.length + '</span></div><div class="l">ประเภทที่มีเครื่องว่าง</div></div>'
        + '<div class="stat"><div class="n">' + loan + '</div><div class="l">กำลังถูกยืม</div></div>';

      $('grid').innerHTML = devices.map((d) => {
        const none = d.ready <= 0;
        const segs = [
          d.ready > 0 ? '<div data-tip="' + esc('ว่าง ' + d.ready + ' เครื่อง') + '" style="flex:' + d.ready + ';background:var(--st-ready)"></div>' : '',
          d.loan > 0 ? '<div data-tip="' + esc('ถูกยืม ' + d.loan + ' เครื่อง') + '" style="flex:' + d.loan + ';background:var(--st-loan)"></div>' : '',
        ].join('');
        return '<div class="row' + (none ? ' none' : '') + '">'
          + '<div><div class="name" title="' + esc(d.name) + '">' + esc(d.name) + '</div>'
          + '<div class="state"><span class="dot"></span>' + (none ? 'ไม่มีเครื่องว่าง' : 'ยืมได้') + '</div></div>'
          + '<div class="avail"><div class="n">' + d.ready + '</div><div class="u">เครื่องว่าง</div></div>'
          + '<div class="usage"><div class="bar">' + segs + '</div>'
          + '<div class="meta">ถูกยืม ' + d.loan + ' จาก ' + d.total + ' เครื่อง</div></div>'
          + '</div>';
      }).join('') || '<div class="empty">ไม่มีข้อมูล</div>';
    }

    async function load() {
      const btn = $('refreshBtn');
      const errBox = $('error');
      btn.disabled = true;
      try {
        render(parseSummary(await fetchSheet(SHEET_NAME)));
        errBox.style.display = 'none';
        $('updated').textContent = 'อัปเดต ' + new Date().toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
      } catch (e) {
        errBox.style.display = 'block';
        errBox.textContent = 'โหลดข้อมูลไม่สำเร็จ (' + e.message + ') – ตรวจสอบว่า Google Sheet แชร์แบบ "ทุกคนที่มีลิงก์ดูได้" และมีแท็บชื่อ ' + SHEET_NAME;
        if (!$('grid').innerHTML) $('updated').textContent = 'ยังโหลดข้อมูลไม่ได้';
      } finally {
        btn.disabled = false;
      }
    }

    $('refreshBtn').addEventListener('click', load);
    const tip = $('tooltip');
    document.addEventListener('mousemove', (e) => {
      const t = e.target.closest('[data-tip]');
      if (!t) { tip.style.display = 'none'; return; }
      tip.textContent = t.dataset.tip;
      tip.style.display = 'block';
      tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
    });

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
